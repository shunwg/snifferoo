<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ordføreren">
  <title>Ordføreren</title>
  <!-- The rosette, the same drawing as LOGO() in Lab/js/ui.js and the
       --mark-rosette mask in base.css. Literal hexes rather than tokens: an app
       icon is rendered by the OS, outside any stylesheet, and must look identical
       on every theme.

       THIS FILE WAS TWO REDESIGNS STALE. It still carried the original monk face
       — bevelled cream head, dot eyes, and a #FF5C97 nose — long after the app
       went monochrome and long after the rat replaced the monk. Nothing caught
       it, because no gate renders the icon and nobody installs the PWA during
       development. If the mark changes again, this file changes with it.

       Dark plane rather than the app's light one, deliberately: a home screen is
       somebody else's wallpaper, and a near-black squircle holds its edge against
       any of them. The light page look belongs inside the app, where we own the
       whole rectangle. -->
  <rect width="512" height="512" rx="112" fill="#16161A"/>
  <g transform="translate(256 256) scale(3.55) translate(-50 -52)" fill="#F6F6F4">
    <path d="M40 60 L26 96 L37 91 L45 99 L53 63 Z M60 60 L74 96 L63 91 L55 99 L47 63 Z"/>
    <path d="M50 12A7.25 7.25 0 0 1 64 15.8A7.25 7.25 0 0 1 74.2 26A7.25 7.25 0 0 1 78 40A7.25 7.25 0 0 1 74.2 54A7.25 7.25 0 0 1 64 64.2A7.25 7.25 0 0 1 50 68A7.25 7.25 0 0 1 36 64.2A7.25 7.25 0 0 1 25.8 54A7.25 7.25 0 0 1 22 40A7.25 7.25 0 0 1 25.8 26A7.25 7.25 0 0 1 36 15.8A7.25 7.25 0 0 1 50 12Z M50 29.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Z"/>
  </g>
</svg>
