# Deploys the playable standalone to https://shunwg.github.io/snifferoo/
#
# THIS FILE MUST LIVE AT THE REPOSITORY ROOT.
# GitHub only reads workflows from <repo-root>/.github/workflows/ — it does NOT
# recurse into subfolders. In the old shunwg/cockymonk monorepo this file could
# not sit next to the game for exactly that reason: when a commit once moved it
# into the game's subfolder, the deploy silently stopped running. No error, no
# failed run, no notification — as far as GitHub was concerned the workflow no
# longer existed, and Pages kept serving the last good deployment, so the URL
# stayed up and looked healthy while going a week stale.
#
# In this repo the game IS the root, so the file and the code finally live
# together. If the repo is ever restructured again, this file stays here.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The gates run here too, not just locally. A red gate must not reach the
      # people you send the link to.
      - name: Gates
        run: |
          node --test Lab/js/engine.test.mjs Lab/js/fixtures.test.mjs \
                      Lab/js/fakepool.test.mjs Lab/js/online.test.mjs
          node Tools/tokens-build.mjs --check
          node Tools/rules-sheet.mjs --check
          node Tools/validate_deck.mjs --all
          node Tools/check-game-feel.mjs --check
          node Tools/check-fake-parity.mjs --check

      # Build from source rather than trusting the committed dist/ — that bundle
      # is regenerated by hand and has drifted before.
      - name: Build standalone bundle from source
        run: node Tools/build-standalone.mjs

      # Fail loudly if the bundle is missing or truncated. Without this a broken
      # build deploys a blank page over a working one, and the first person to
      # notice is whoever you sent the link to.
      - name: Verify the bundle is real
        run: |
          test -s dist/Snifferoo.html
          bytes=$(wc -c < dist/Snifferoo.html)
          echo "bundle: $bytes bytes"
          test "$bytes" -gt 400000
          grep -q "<title>Snifferoo</title>" dist/Snifferoo.html

      - name: Stage site
        run: |
          mkdir site
          cp dist/Snifferoo.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
